# Публикация Docker-образа в Docker Hub (h5vx/botmanager) при пуше тега
# версии вида v1.2.3. Теги модуля api/ (api/v1.2.3) образ не собирают.
# Перед публикацией образ проходит smoke-тест по шагам quickstart из README
# (scripts/docker-smoke.sh). Ручной запуск (workflow_dispatch) выполняет
# тесты и smoke-тест без публикации.
#
# Секрет репозитория DOCKERHUB_TOKEN — access token Docker Hub с правом
# Read & Write для пользователя h5vx.
name: docker

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: h5vx/botmanager

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            api/go.sum

      - name: Vet
        run: |
          go vet ./...
          (cd api && go vet ./...)

      - name: Test
        run: |
          go test -race ./...
          (cd api && go test -race ./...)

  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: botmanager:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Quickstart smoke test
        run: scripts/docker-smoke.sh botmanager:smoke

  publish:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: h5vx
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Теги образа из тега git:
      #   v1.2.3       -> 1.2.3, 1.2, 1, latest
      #   v1.0         -> 1.0, 1, latest
      #   v1.2.3-rc.1  -> 1.2.3-rc.1 (latest не трогаем)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=match,pattern=^v(\d+\.\d+\.\d+(-.+)?)$,group=1
            type=match,pattern=^v(\d+\.\d+)(\.\d+)?$,group=1
            type=match,pattern=^v(\d+)\.\d+(\.\d+)?$,group=1
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
