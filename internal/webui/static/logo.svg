<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="botmanager logo">
  <title>botmanager</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37AEE2"/>
      <stop offset="1" stop-color="#1E86C8"/>
    </linearGradient>
  </defs>
  <!-- cluster links -->
  <g stroke="#1E86C8" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <line x1="64" y1="64" x2="22" y2="22"/>
    <line x1="64" y1="64" x2="106" y2="22"/>
    <line x1="64" y1="64" x2="64" y2="116"/>
  </g>
  <!-- follower nodes -->
  <g fill="#fff" stroke="#1E86C8" stroke-width="4">
    <circle cx="22" cy="22" r="10"/>
    <circle cx="106" cy="22" r="10"/>
    <circle cx="64" cy="116" r="10"/>
  </g>
  <!-- leader node: bot head -->
  <circle cx="64" cy="64" r="34" fill="url(#bg)"/>
  <line x1="64" y1="30" x2="64" y2="22" stroke="#1E86C8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="64" cy="20" r="4" fill="#1E86C8"/>
  <rect x="42" y="50" width="44" height="30" rx="12" fill="#fff"/>
  <circle cx="55" cy="65" r="5" fill="#1E86C8"/>
  <circle cx="73" cy="65" r="5" fill="#1E86C8"/>
  <!-- paper plane -->
  <path d="M46 92 L84 84 L72 98 Z" fill="#fff" opacity="0.9"/>
</svg>
