# Конфигурация для локальной разработки (make run): один узел, данные в
# ./data, без TLS и шифрования токенов. Не использовать в эксплуатации —
# см. config/config.yaml.

node:
  id: node-1
  data_dir: ./data
  raft_bind_addr: "127.0.0.1:9092"

raft:
  bootstrap: true

grpc:
  listen_addr: "127.0.0.1:9090"

http:
  listen_addr: "127.0.0.1:9091"

security:
  insecure: true

observability:
  log_level: DEBUG
