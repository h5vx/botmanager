# Конфигурация botmanager.
#
# Любое значение здесь переопределяется переменной окружения с префиксом
# BOTMANAGER_, вложенность отделяется "__". Пример: чтобы поменять
# grpc.listen_addr, задать BOTMANAGER_GRPC__LISTEN_ADDR.
#
# Токенов ботов в этом файле нет и не будет — токены передаются через
# BotAdmin.CreateBot/UpdateBot и хранятся (зашифрованными) в состоянии Raft.
#
# Для локального запуска без сертификатов см. config/dev.yaml.

node:
  id: node-1
  data_dir: /var/lib/botmanager
  # Адрес, на котором слушает Raft-транспорт (internal/raftcluster).
  raft_bind_addr: "0.0.0.0:9092"
  # Адрес, по которому этот узел доступен остальным узлам (Raft). Обязателен,
  # если raft_bind_addr не маршрутизируем (0.0.0.0). Сертификат узла должен
  # быть выписан на этот хост.
  raft_advertise_addr: "127.0.0.1:9092"
  # gRPC-адрес для остальных узлов (пересылка записей лидеру, проверки
  # доступности). Пусто — хост raft_advertise_addr + порт grpc.listen_addr.
  grpc_advertise_addr: ""

# Настройки Raft-кластера этого узла (internal/raftcluster).
raft:
  # Сколько последних сообщений хранить на каждого бота — retention по
  # числу записей, не по времени.
  message_retention_per_bot: 500
  # Сколько последних событий журнала Messaging.Subscribe хранить —
  # столько истории доступно для возобновления подписки.
  journal_retention: 10000
  # Бутстрапить новый кластер на этом узле, если у него ещё нет состояния
  # Raft. Безопасно оставлять true между перезапусками. Узел, который
  # добавят в работающий кластер через Maintenance.AddNode, запускают с false.
  bootstrap: true
  # Остальные узлы при статическом развёртывании кластера (одинаковый
  # список на всех узлах, кроме самого себя). Через окружение:
  # BOTMANAGER_RAFT__PEERS="node-2/10.0.0.2:9092/10.0.0.2:9090,node-3/..."
  peers: []
  #  - id: node-2
  #    raft_addr: "10.0.0.2:9092"
  #    grpc_addr: "10.0.0.2:9090"
  # Таймауты Raft, мс; 0 — умолчания (1000/1000/500). Меньше — быстрее
  # замена упавшего лидера, но выше риск ложных выборов в медленной сети.
  # leader_lease <= heartbeat <= election, одинаково на всех узлах.
  heartbeat_timeout_ms: 0
  election_timeout_ms: 0
  leader_lease_timeout_ms: 0

# Передача лидерства, когда лидер перестал видеть Telegram (сеть, прокси),
# а другой узел его видит — Raft сам такого лидера не заменит. Узел считает
# проблемой себя, когда не меньше min_failing_bots ботов (и не меньше
# половины работающих) не получают от Telegram никакого ответа
# failure_window_seconds подряд. Лидерство уходит только узлу, который
# проверил доступ к Telegram для этих же ботов (их токен и прокси).
failover:
  enabled: true
  failure_window_seconds: 60
  min_failing_bots: 1
  cooldown_seconds: 300
  check_interval_seconds: 10

grpc:
  listen_addr: ":9090"

http:
  listen_addr: ":9091"

# Прокси по умолчанию для узла. Каждый бот может переопределить это значение
# или явно отключить прокси через UpdateBot.
proxy:
  enabled: false
  address: ""

telegram:
  request_timeout_seconds: 10
  long_poll_timeout_seconds: 30
  # Сколько раз повторить отправку сообщения (проблема узла/неизвестная
  # ошибка) прежде чем статус доставки станет FAILED.
  max_send_retries: 10
  # Как часто раннер проверяет очередь исходящих сообщений в фоне —
  # подстраховка поверх немедленного пробуждения по SubscribeApplied.
  send_poll_interval_seconds: 2
  # Переопределить хост Telegram Bot API (свой Bot API сервер, тестовый
  # стенд) — пусто означает официальный api.telegram.org.
  api_base_url_override: ""

# mTLS для gRPC API и Raft-транспорта и ключ шифрования токенов ботов.
# Сгенерировать для разработки или небольшой установки:
#   go run ./cmd/botmanager-certs init  -out certs
#   go run ./cmd/botmanager-certs issue -out certs -name node-1 -hosts 127.0.0.1,localhost
security:
  # true — без TLS, без аутентификации, токены открытым текстом. Только для
  # локальной разработки.
  insecure: false
  ca_file: /etc/botmanager/certs/ca.pem
  cert_file: /etc/botmanager/certs/node.pem
  key_file: /etc/botmanager/certs/node-key.pem
  token_key_file: /etc/botmanager/certs/token.key

observability:
  log_level: INFO
  version: dev
